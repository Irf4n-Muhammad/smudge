<section class="published-posts" aria-label="Published posts">
  <div class="post-grid post-grid-comic" id="profile-posts"></div>
</section>
<script>
  profileData
    .then(async (d) => {
      const root = document.getElementById("profile-posts");
      const icons = {
        like: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',
        comment: '<path d="M21 11.5a9 9 0 0 1-13 8L3 21l1.5-5A9 9 0 1 1 21 11.5Z"/>',
        save: '<path d="M5 21V3h14v18l-7-5Z"/>',
        more: '<circle cx="4" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="20" cy="12" r="1"/>',
      };
      const buttons = new Map();
      for (const p of d.posts.filter((p) => p.format !== "story")) {
        const card = document.createElement("article");
        card.className = "post-tile";
        card.innerHTML =
          '<svg class="post-outline" viewBox="0 0 470 480" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1H457L469 450L441 479H1Z"/></svg>';
        const open = document.createElement("button");
        open.className = "post-open";
        open.setAttribute("aria-label", "Open " + p.title);
        const coffee = p.title === "Pages from Sunday";
        open.innerHTML =
          '<div class="art"><svg viewBox="' +
          (coffee ? "537 480 465 470" : "30 480 465 470") +
          '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#raka-art" clip-path="url(#clip-' +
          (coffee ? "coffee" : "skate") +
          ')"/></svg></div>';
        if (
          d.owner.id === "raka" &&
          !p.hasCover &&
          ["Pages from Sunday", "The long way home"].includes(p.title)
        ) {
          open.innerHTML =
            '<div class="art"><svg viewBox="' +
            (coffee ? "508 852 491 372" : "26 843 470 389") +
            '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#raka-reference"/></svg></div>';
        }
        const art = open.querySelector(".art");
        if (
          p.hasCover ||
          d.owner.id !== "raka" ||
          !["Pages from Sunday", "The long way home"].includes(p.title)
        )
          art.textContent = p.title;
        const author = document.createElement("strong");
        author.textContent = d.owner.name;
        const caption = document.createElement("p");
        caption.textContent = p.caption || p.title;
        open.append(author, caption);
        const status = document.createElement("small");
        status.className = "post-status";
        status.setAttribute("role", "status");
        const navigate = () =>
          forma.profile.openPost(p.id).catch((e) => (status.textContent = e.message));
        open.onclick = navigate;
        const actions = document.createElement("div");
        actions.className = "tile-actions";
        const controls = {};
        for (const kind of ["like", "comment", "save", "more"]) {
          const b = document.createElement("button");
          b.className = "tile-" + kind;
          b.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true">' + icons[kind] + "</svg><span></span>";
          b.setAttribute(
            "aria-label",
            { like: "Like ", comment: "Comments on ", save: "Save ", more: "Open options for " }[
              kind
            ] + p.title,
          );
          if (kind === "like" || kind === "save") b.disabled = true;
          b.onclick =
            kind === "comment" || kind === "more"
              ? navigate
              : async () => {
                  b.disabled = true;
                  try {
                    const s = await forma.profile.social.toggle({ action: kind, postId: p.id });
                    window.dispatchEvent(new CustomEvent("profile-social", { detail: s }));
                  } catch (e) {
                    status.textContent = e.message;
                    b.disabled = false;
                  }
                };
          controls[kind] = b;
          actions.append(b);
        }
        buttons.set(p.id, controls);
        card.append(open, actions, status);
        root.append(card);
        if (p.hasCover) {
          const observer = new IntersectionObserver(
            (entries) => {
              if (!entries.some((e) => e.isIntersecting)) return;
              observer.disconnect();
              forma.profile
                .cover(p.id)
                .then((cover) => {
                  if (!cover) return;
                  const img = document.createElement("img");
                  img.src = cover.src;
                  img.alt = cover.alt;
                  img.style.cssText = "display:block;width:100%;height:100%;object-fit:cover";
                  art.replaceChildren(img);
                })
                .catch((e) => {
                  status.textContent = "Cover unavailable: " + e.message;
                });
            },
            { rootMargin: "200px" },
          );
          observer.observe(card);
        }
      }
      window.addEventListener("profile-social", ({ detail: s }) => {
        for (const p of s.posts) {
          const b = buttons.get(p.id);
          if (!b) continue;
          b.like.querySelector("span").textContent = p.likes;
          b.comment.querySelector("span").textContent = p.comments;
          b.like.setAttribute("aria-pressed", String(p.liked));
          b.save.setAttribute("aria-pressed", String(p.saved));
          b.like.disabled = b.save.disabled = !s.writable;
        }
      });
      refreshSocial();
      if (!root.children.length) {
        root.className = "empty";
        root.textContent = "No posts yet. Your next story starts here.";
      }
    })
    .catch(() => {
      document.getElementById("profile-posts").textContent =
        "Posts could not load. Refresh this page to try again.";
    });
</script>
