<link rel="stylesheet" href="raka/base.css" />
<link rel="stylesheet" href="raka/reference.css" />
<svg class="art-library" aria-hidden="true">
  <defs>
    <clipPath id="continuation-window"><rect x="0" y="1335" width="1024" height="123" /></clipPath>
    <image
      id="raka-reference"
      width="1024"
      height="1536"
      href="asset:30000000-0000-4000-8000-000000000003"
    />
    <image
      id="raka-clean-paper"
      width="1024"
      height="1536"
      href="asset:30000000-0000-4000-8000-000000000004"
    />
    <image
      id="raka-art"
      width="1536"
      height="1024"
      href="asset:30000000-0000-4000-8000-000000000001"
    />
    <clipPath id="clip-hand"><rect x="0" y="0" width="540" height="475" /></clipPath>
    <clipPath id="clip-avatar"><rect x="548" y="20" width="465" height="440" /></clipPath>
    <clipPath id="clip-name"><rect x="1010" y="0" width="526" height="450" /></clipPath>
    <clipPath id="clip-skate"><rect x="30" y="480" width="465" height="470" /></clipPath>
    <clipPath id="clip-coffee"><rect x="537" y="480" width="465" height="470" /></clipPath>
    <clipPath id="clip-paper"><rect x="1036" y="468" width="486" height="490" /></clipPath>
  </defs>
</svg>
<main class="world">
  <script>
    window.profileData = forma.profile.read();
    window.profileData.catch(() => {});
    window.refreshSocial = async () => {
      try {
        const data = await forma.profile.social.read();
        window.dispatchEvent(new CustomEvent("profile-social", { detail: data }));
        return data;
      } catch {
        return null;
      }
    };
    window.addEventListener("focus", window.refreshSocial);
  </script>
  <!--forma:profile-->
  <!--forma:story-->
  <!--forma:feature-->
  <!--forma:post-->
  <section class="reference-continuation" aria-label="More to explore">
    <svg viewBox="0 1335 1024 123" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <use href="#raka-reference" clip-path="url(#continuation-window)" />
    </svg>
    <button class="explore-left" aria-label="Explore sketchbook"></button>
    <button class="explore-right" aria-label="Explore another post"></button>
    <span role="status" id="explore-status"></span>
  </section>
  <script>
    profileData.then((d) => {
      const targets = [
        d.posts.find((p) => p.format === "story"),
        d.posts.find((p) => p.format !== "story"),
      ];
      document.querySelectorAll(".reference-continuation button").forEach((b, i) => {
        b.disabled = !targets[i];
        b.onclick = () =>
          forma.profile
            .openPost(targets[i].id)
            .catch(
              () => (document.getElementById("explore-status").textContent = "Please try again."),
            );
      });
    });
  </script>
</main>
