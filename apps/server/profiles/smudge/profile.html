<!-- smudge:v14 -->
<link rel="stylesheet" href="smudge/parts.css" />
<script src="smudge/helpers.js"></script>
<div class="sm">
  <!-- The Track's hero (ADR 0057), drawn instead of the poster when the look is "track": the
       name as big as the page, the owner cut out of a photo in front of it, their things cut
       out around it with sticker lines, the next thing on their calendar in the corner. -->
  <section class="thero" id="thero" aria-label="About" hidden>
    <div class="thero-bar">
      <div class="tlogo" data-edit="name">
        <span class="s" id="tlogo-first"></span><span class="b" id="tlogo-rest"></span>
      </div>
      <span class="tmark" id="tmark" aria-hidden="true"></span>
      <span class="tplace" id="tplace" data-edit="place"></span>
    </div>
    <h1 class="tgiant" id="tgiant" data-edit="name">
      <span id="tgiant-first"></span><em id="tgiant-rest"></em>
    </h1>
    <div class="tme" id="tme" data-edit="cutout"></div>
    <div class="tthings" id="tthings" data-edit="things"></div>
    <div class="tstickers" id="tstickers" data-edit="chapters"></div>
    <div class="tnext" id="tnext" data-edit="next"></div>
    <div class="tintro" data-edit="tagline">
      <p id="tintro-line"></p>
      <span id="tintro-place"></span>
    </div>
  </section>
  <!-- The Track's band (ADR 0057, stage two): what's going on right now, on the olive, the
       photo of the chapter it belongs to behind it; the manifesto wall follows on the same olive. -->
  <section class="tband" id="tband" aria-label="Right now" data-edit="now" hidden>
    <div class="tband-k"><b id="tband-mark"></b>Right now</div>
    <div class="tvideo" id="tvideo" hidden>
      <img id="tvideo-img" alt="" hidden />
      <span class="tplay" aria-hidden="true"><i></i></span>
      <div class="tcap"><b id="tcap-text"></b><span id="tcap-where"></span></div>
      <div class="tbar" id="tbar" hidden><i id="tbar-fill"></i></div>
    </div>
    <p class="hint" id="tband-hint" hidden>What are you up to? It goes here, on the olive.</p>
  </section>
  <!-- The poster hero (ADR 0048): the name as big as the page, the photo pushed into it, and
       under them the song and what's going on. Nothing here is decoration without a job. -->
  <section class="hero" id="hero" aria-label="About">
    <div class="idx">
      <span>Smudge / <span id="hero-first"></span></span>
      <span id="hero-place" data-edit="place"></span>
    </div>
    <h1 class="giant" id="giant" data-edit="name"><span id="giant-name"></span></h1>
    <p class="giant2" id="giant-line" data-edit="tagline"></p>
    <div class="poster">
      <div class="avatar" id="avatar" data-edit="photo"></div>
      <span class="mark" aria-hidden="true"></span>
      <ul class="meta" id="hero-meta" data-edit="about"></ul>
    </div>
    <!-- Live entries first (ADR 0044); what the owner typed wins while they edit. -->
    <div class="hero-now" id="hero-now" data-edit="now">
      <div class="song" id="song" hidden>
        <small id="song-kind">Now playing</small>
        <strong id="song-title"></strong>
        <span id="song-by"></span>
        <span class="song-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="doing" id="doing" hidden>
        <small>Right now</small>
        <strong id="doing-text"></strong>
        <time id="doing-when"></time>
      </div>
    </div>
  </section>
  <!-- The owner's words (ADR 0054): a few sentences as big as the page, the starred words in
       the serif and the palette, the way a manifesto reads on a poster. -->
  <p class="manifesto" id="manifesto" data-edit="manifesto" hidden></p>
  <!-- Chapters: who this is, shown with one measurable thing each (ADR 0048, drawn as in the
       profile mock from ADR 0052: a Run in a card, Work as a note and tags, Music as hours). -->
  <div class="chapters" id="chapters" data-edit="chapters" hidden></div>
  <!-- From the roll (ADR 0053): photos laid freely, each with a place and a year. -->
  <section class="roll" id="roll" aria-label="From the roll" data-edit="roll" hidden>
    <div class="idx">
      <span>From the roll</span>
      <span id="roll-count"></span>
    </div>
    <div class="roll-grid" id="roll-grid"></div>
    <p class="note ghost-note" id="roll-hint" hidden>
      Photos from your roll go here, each with a place and a year.
    </p>
  </section>
  <!-- The Track, stage three (ADR 0057): the chapters' numbers in a row, then the affiliations
       as crests, each a name and a line. -->
  <section class="tstats" id="tstats" aria-label="Numbers" data-edit="chapters" hidden></section>
  <section class="taff" id="taff" aria-label="Affiliations" data-edit="crews" hidden>
    <div class="taff-k">
      <span>Affiliations</span><span class="m">what the page can say about you</span>
    </div>
    <div class="taff-grid" id="taff-grid"></div>
    <p class="hint" id="taff-hint" hidden>Crews, clubs, places: a name and a line each.</p>
  </section>
  <!-- Picks (ADR 0052, 0056): the four latest posts as blocks, the way to the Posts page. -->
  <section class="picks" id="picks" aria-label="Picks" hidden>
    <div class="idx">
      <span>Picks</span>
      <span id="picks-count"></span>
    </div>
    <div class="picks-grid" id="picks-grid"></div>
    <span class="part-status" id="picks-status" role="status"></span>
  </section>
</div>
<script>
  (() => {
    const $ = (id) => document.getElementById(id);
    // Easy-editor settings (smudge/settings.js); every field falls back to the profile's own data.
    const settings = window.smudgeSettings || {};
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    // Shrink the giant name until it fits the hero, whatever its length. The size goes on the
    // heading itself, so its line box shrinks with the letters and leaves no gap above.
    function fit() {
      const h = $("giant"),
        name = $("giant-name");
      if ($("hero").hidden) return;
      const max = Math.min(260, Math.max(120, h.clientWidth * 0.46));
      let size = max;
      h.style.fontSize = size + "px";
      while (name.scrollWidth > h.clientWidth && size > 44) {
        size -= 4;
        h.style.fontSize = size + "px";
      }
      // The short second line (a surname, a word) stays one line too, shrinking before it
      // would break over the photo.
      const line = $("giant-line");
      line.style.fontSize = "";
      if (!line.classList.contains("long")) {
        let px = parseFloat(getComputedStyle(line).fontSize);
        while (line.scrollWidth > line.clientWidth && px > 40) {
          px -= 4;
          line.style.fontSize = px + "px";
        }
      }
    }
    window.addEventListener("resize", fit);
    const ago = (iso) => {
      const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
      if (mins < 60) return mins <= 1 ? "just now" : mins + " min ago";
      const hours = Math.round(mins / 60);
      if (hours < 24) return hours + " h ago";
      const days = Math.round(hours / 24);
      return days === 1 ? "yesterday" : days + " days ago";
    };
    const day = (iso) =>
      new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    let liveNow = null;
    window.addEventListener("forma:editing", () => heroNow(liveNow));
    function heroNow(live) {
      liveNow = live;
      const editing = document.documentElement.dataset.editing === "on";
      const typed =
        settings.repeat && settings.repeat.song
          ? { text: settings.repeat.song, by: settings.repeat.artist }
          : null;
      const heard = live && live.listening;
      const song = editing ? typed || heard : heard || typed;
      $("song").hidden = !song;
      if (song) {
        $("song-kind").textContent = song.source === "spotify" ? "Spotify · playing" : "On repeat";
        $("song-title").textContent = song.text;
        $("song-by").textContent = song.by || "";
        $("song").classList.toggle("live", song.source === "spotify");
      }
      const typedDoing =
        settings.now && settings.now.text ? { text: settings.now.text, at: "" } : null;
      const seen = live && live.current;
      const doing = editing ? typedDoing || seen : seen || typedDoing;
      $("doing").hidden = !doing;
      if (doing) {
        $("doing-text").textContent = doing.text;
        $("doing-when").textContent = doing.at ? ago(doing.at) : "";
        if (doing.at) $("doing-when").dateTime = doing.at;
      }
      if (settings.look === "track") trackBand(doing);
    }
    // The Track's band: the same "right now" as the poster's, as a still from a film, with the
    // photo of the chapter it belongs to (Work first) behind it and the progress as a bar.
    function trackBand(doing) {
      const band = $("tband");
      band.hidden = false;
      const now = settings.now || {};
      const chapters = settings.chapters || [];
      const pic =
        (chapters.find((c) => c.kind === "work" && c.photo) || chapters.find((c) => c.photo) || {})
          .photo || ((settings.roll || [])[0] || {}).photo;
      const img = $("tvideo-img");
      img.hidden = !pic;
      if (pic) img.src = photoOf(pic);
      $("tvideo").hidden = !doing;
      $("tband-hint").hidden = !!doing;
      if (doing) {
        $("tcap-text").textContent = doing.text;
        // The place and the progress belong to what the owner typed, not to a live entry.
        const typed = !doing.at;
        const where = typed
          ? [now.place, now.progress ? now.progress + "% there" : ""].filter(Boolean).join(" · ")
          : ago(doing.at);
        $("tcap-where").textContent = where;
        $("tbar").hidden = !typed || !now.progress;
        $("tbar-fill").style.width = Math.min(100, Math.max(0, now.progress || 0)) + "%";
      }
    }
    // A line in *stars* turns italic; without stars the first word does.
    const marked = (text, target) => {
      const line = text.includes("*") ? text : text.replace(/^(\S+)/, "*$1*");
      target.textContent = "";
      line.split("*").forEach((piece, i) => {
        if (!piece) return;
        target.append(i % 2 ? el("em", "", piece) : document.createTextNode(piece));
      });
    };
    const kinds = { run: "Run", work: "Work", music: "Music", custom: "" };
    // The route drawn in a Run chapter: a loop, the same for everyone, a picture not a map.
    const route =
      "M14 96C40 92 52 60 78 54S120 70 142 48 180 14 214 22 262 60 286 44 306 20 304 30c-4 20-34 56-64 62s-50-12-80 6-60 20-100 16-40-4-46-12Z";
    const routeSvg = () => {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 318 120");
      svg.setAttribute("class", "route");
      svg.setAttribute("aria-hidden", "true");
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", route);
      svg.append(p);
      for (const [cx, cy, cls] of [
        [14, 96, "start"],
        [304, 30, "end"],
      ]) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", cx);
        c.setAttribute("cy", cy);
        c.setAttribute("r", 4);
        c.setAttribute("class", cls);
        svg.append(c);
      }
      return svg;
    };
    // A photo is one of the page's own pictures, handed in by the runtime (ADR 0050), with a
    // place and a year under it when the owner wrote one (ADR 0053).
    const figureOf = (id, caption, cls) => {
      const src = id && (window.smudgePhotos || {})[id];
      if (!src) return null;
      const fig = el("figure", cls);
      const img = document.createElement("img");
      img.src = src;
      img.alt = caption || "";
      fig.append(img);
      if (caption) fig.append(el("figcaption", "", caption));
      return fig;
    };
    // A cassette drawn from a Music chapter (ADR 0055): the title on the label as the band, the
    // big number under it, the corner line on the spine; nothing without a title or a number.
    const tapeOf = (c) => {
      const title = (c.title || "").replace(/\*/g, "").trim();
      const hours = [c.big, c.unit].filter(Boolean).join(" ");
      if (!title && !hours) return null;
      const tape = el("div", "tape");
      tape.setAttribute("role", "img");
      tape.setAttribute("aria-label", [title, hours].filter(Boolean).join(", "));
      for (let i = 0; i < 4; i++) tape.append(el("span", "screw"));
      const label = el("div", "label");
      label.append(el("b", "", title || hours), el("i", "", title ? hours : ""));
      const foot = el("small", "");
      foot.append(el("span", "", "Side A"), el("span", "", c.label || ""));
      label.append(foot);
      const win = el("div", "win");
      win.append(el("span", "reel l"), el("span", "reel r"));
      tape.append(label, win, el("div", "base"));
      return tape;
    };
    // The chapter's pictures: the photo, then up to two snaps laid around it.
    const picsOf = (c) => {
      const main = figureOf(c.photo, c.caption, "photo");
      const snaps = (c.snaps || []).map((p, i) =>
        figureOf(p.photo, p.caption, "photo snap snap-" + (i + 1)),
      );
      const all = [main, ...snaps].filter(Boolean);
      if (!all.length) return null;
      const box = el("div", "pics");
      box.append(...all);
      return box;
    };
    const bigOf = (c) => {
      const big = el("p", "big");
      big.append(el("strong", "", c.big));
      if (c.unit) big.append(el("em", "", c.unit));
      return big;
    };
    const statsOf = (c) => {
      const stats = (c.stats || []).filter((s) => s.value);
      if (!stats.length) return null;
      const row = el("dl", "stats");
      for (const s of stats) {
        const cell = el("div", "");
        cell.append(el("dd", "", s.value), el("dt", "", s.label));
        row.append(cell);
      }
      return row;
    };
    const linesOf = (c, cls) => {
      const lines = (c.lines || []).filter(Boolean);
      if (!lines.length) return null;
      const ol = el("ol", cls);
      lines.forEach((text, n) => {
        const li = el("li", "");
        if (cls === "lines") li.append(el("span", "", "0" + (n + 1)));
        li.append(el("b", "", text));
        ol.append(li);
      });
      return ol;
    };
    function chapters() {
      const list = Array.isArray(settings.chapters) ? settings.chapters : [];
      const box = $("chapters");
      box.textContent = "";
      box.hidden = false;
      // Nothing written yet: the owner sees three empty chapters to tap, a visitor sees none.
      if (!list.length) {
        const ghosts = [
          ["Run", "Your best time, or how far you got."],
          ["Work", "Where you've been, and for how long."],
          ["Music", "The band you've given the most hours to."],
        ];
        ghosts.forEach(([kind, hint], i) => {
          const sec = el("section", "chapter ghost");
          sec.setAttribute("aria-label", "Empty chapter: " + kind);
          const head = el("div", "idx");
          head.append(el("span", "", "0" + (i + 1) + " / " + kind), el("span", "", "Tap to write"));
          sec.append(head, el("p", "note", hint));
          box.append(sec);
        });
        return;
      }
      list.forEach((c, i) => {
        const sec = el("section", "chapter chapter-" + c.kind);
        sec.setAttribute("aria-label", c.title || kinds[c.kind] || "Chapter " + (i + 1));
        const head = el("div", "idx");
        head.append(
          el("span", "", "0" + (i + 1) + " / " + (kinds[c.kind] || c.title || "")),
          el("span", "", c.label || ""),
        );
        sec.append(head);
        const add = (...nodes) => nodes.forEach((n) => n && sec.append(n));
        // On Music the title goes on the cassette's label (ADR 0055), not above it.
        const tape = c.kind === "music" ? tapeOf(c) : null;
        if (c.title && !tape) {
          const h = el("h2", "");
          marked(c.title, h);
          sec.append(h);
        }
        const photo = picsOf(c);
        if (c.kind === "run") {
          // The run as a card: the route, the time, the note under it, the stats; the photo
          // laid over the card's corner.
          const card = el("div", "card");
          card.append(routeSvg());
          if (c.big) card.append(bigOf(c));
          if (c.note) card.append(el("p", "caption", c.note));
          const stats = statsOf(c);
          if (stats) card.append(stats);
          add(card, photo, linesOf(c, "lines"));
        } else if (c.kind === "work") {
          // Work as a note, the photo, and the lines as tags.
          add(c.big ? bigOf(c) : null, c.note ? el("p", "note", c.note) : null, photo);
          add(statsOf(c), linesOf(c, "pills"));
        } else {
          // Music and anything else: the big number first, the note, the cassette (ADR 0055),
          // the lines, the photo last.
          add(c.big ? bigOf(c) : null, c.note ? el("p", "note", c.note) : null, tape);
          add(statsOf(c), linesOf(c, "lines"), photo);
        }
        box.append(sec);
      });
    }
    // Photos from the roll (ADR 0053): laid freely by the stylesheet, each with its caption. The
    // owner sees where they go while editing; a visitor sees nothing until there are some.
    function roll() {
      const list = Array.isArray(settings.roll) ? settings.roll : [];
      const figs = list.map((p) => figureOf(p.photo, p.caption, "photo")).filter(Boolean);
      const sec = $("roll");
      sec.hidden = !figs.length;
      sec.classList.toggle("ghost", !figs.length);
      $("roll-hint").hidden = figs.length > 0;
      $("roll-count").textContent = figs.length + (figs.length === 1 ? " photo" : " photos");
      const grid = $("roll-grid");
      grid.textContent = "";
      grid.append(...figs);
    }
    // Picks (ADR 0052, 0056): the four latest posts as blocks, each opening in the app's dialog.
    // The first two carry their covers; the next two are blocks of colour with the post's caption
    // set in the serif, so the band always reads as photos and words whatever the posts hold.
    function picks(posts) {
      const list = (posts || [])
        .slice()
        .sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0))
        .slice(0, 4);
      $("picks").hidden = !list.length;
      if (!list.length) return;
      $("picks-count").textContent = posts.length + (posts.length === 1 ? " post" : " posts");
      const grid = $("picks-grid");
      grid.textContent = "";
      list.forEach((post, i) => {
        const tint = i >= 2;
        const b = el("button", "pick" + (tint ? " tint" : ""));
        b.type = "button";
        b.setAttribute("aria-label", "Open " + post.title);
        const cap = el("span", "pick-cap");
        cap.append(el("strong", "", post.title), el("small", "", day(post.createdAt)));
        b.append(cap);
        if (tint && post.caption) b.append(el("span", "pick-say", post.caption));
        b.addEventListener("click", () => window.openProfilePost(post.id, $("picks-status")));
        grid.append(b);
        if (tint) return;
        window.coverFor(post).then((cover) => {
          if (!cover) return;
          const img = document.createElement("img");
          img.src = cover.src;
          img.alt = cover.alt || "";
          b.prepend(img);
          b.classList.add("has-cover");
        });
      });
    }
    const photoOf = (id) => (window.smudgePhotos || {})[id] || "";
    // The Track's hero (ADR 0057). Everything on it is the owner's: the name, the cutouts, the
    // chapters' labels as stickers, the next thing on their calendar, the line and the place.
    function trackHero(d, first, rest) {
      $("hero").hidden = true;
      $("thero").hidden = false;
      $("tlogo-first").textContent = first;
      $("tlogo-rest").textContent = rest;
      $("tmark").textContent = "";
      $("tmark").append(el("b", "", first.slice(0, 1)), el("i", "", (rest || first).slice(0, 1)));
      $("tband-mark").textContent = first.slice(0, 1) + (rest || first).slice(0, 1);
      $("tplace").textContent = settings.place || "@" + d.owner.handle;
      $("tgiant-first").textContent = first;
      $("tgiant-rest").textContent = rest;
      const me = $("tme");
      me.textContent = "";
      me.classList.toggle("blank", !settings.cutout);
      if (settings.cutout) {
        const img = document.createElement("img");
        img.src = photoOf(settings.cutout);
        img.alt = "";
        me.append(img, el("span", "thand", "that's me"));
      } else me.append(el("span", "hint", "Add a cutout of you (a PNG with no background)"));
      const things = $("tthings");
      things.textContent = "";
      (settings.things || []).forEach((t, i) => {
        const fig = el("figure", "tthing tthing-" + (i + 1));
        const img = document.createElement("img");
        img.src = photoOf(t.photo);
        img.alt = "";
        fig.append(img);
        if (t.caption) fig.append(el("figcaption", "tsticker", t.caption));
        things.append(fig);
      });
      const stickers = $("tstickers");
      stickers.textContent = "";
      (settings.chapters || [])
        .map((c) => (c.label || c.title || "").replace(/\*/g, "").trim())
        .filter(Boolean)
        .slice(0, 3)
        .forEach((text, i) => stickers.append(el("span", "tsticker paper n" + (i + 1), text)));
      const next = $("tnext");
      next.textContent = "";
      const n = settings.next || {};
      next.classList.toggle("blank", !n.title);
      if (n.title) {
        next.append(el("small", "", "Next up"), el("b", "", n.title), el("span", "", n.when || ""));
      } else next.append(el("small", "hint", "Next up: what's on your calendar?"));
      trackStats();
      trackCrews();
      marked(settings.tagline || d.owner.bio || "", $("tintro-line"));
      $("tintro-place").textContent = settings.place
        ? settings.place + " · " + new Date().getFullYear()
        : "@" + d.owner.handle;
    }
    // The chapters' numbers in a row: the big figure with its unit small, the title, the label.
    function trackStats() {
      const sec = $("tstats");
      sec.textContent = "";
      const rows = (settings.chapters || []).filter((c) => c.big);
      sec.hidden = !rows.length;
      rows.forEach((c) => {
        const stat = el("div", "tstat");
        const b = el("b", "", c.big);
        if (c.unit) b.append(el("small", "", c.unit));
        const title = el("div", "tlbl");
        marked(c.title || "", title);
        stat.append(b, title, el("span", "m", c.label || ""));
        sec.append(stat);
      });
    }
    // Affiliations as crests: the owner's crews, clubs and places, a name and a line each.
    function trackCrews() {
      const list = (settings.crews || []).filter((c) => c.name);
      const sec = $("taff");
      sec.hidden = false;
      sec.classList.toggle("blank", !list.length);
      $("taff-hint").hidden = list.length > 0;
      const grid = $("taff-grid");
      grid.textContent = "";
      list.forEach((c) => {
        const crest = el("div", "tcrest");
        crest.append(el("b", "", c.name), el("span", "", c.line || ""));
        grid.append(crest);
      });
    }
    // The Track's motion (ADR 0057, stage four): things arrive as they come into view, the
    // numbers count up once, and the hero's cutouts drift at their own speeds while it leaves.
    // The page sits in a frame that does not scroll itself, so the hero's visible share stands
    // in for the scroll. Nothing moves for someone who asked for reduced motion.
    function trackMotion() {
      const marks = [
        ["#tvideo", 0],
        ["#manifesto", 0],
        ...[".tstat", ".tcrest", "#roll-grid .photo", "#picks-grid > *"].map((s) => [s, 1]),
        [".wall-foot strong", 0],
      ];
      marks.forEach(([sel, stagger]) =>
        document.querySelectorAll(sel).forEach((node, i) => {
          node.classList.add("rv");
          if (stagger && i % 4) node.classList.add("d" + (i % 4));
        }),
      );
      const all = document.querySelectorAll(".rv");
      if (
        !("IntersectionObserver" in window) ||
        matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        all.forEach((node) => node.classList.add("in"));
        return;
      }
      const seen = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("in");
            seen.unobserve(entry.target);
            entry.target.querySelectorAll(".tstat > b, :scope > b").forEach(countUp);
          });
        },
        { threshold: 0.18 },
      );
      all.forEach((node) => seen.observe(node));
      const hero = $("thero");
      const steps = Array.from({ length: 51 }, (_, i) => i / 50);
      const drift = new IntersectionObserver(
        (entries) => {
          const r = entries[entries.length - 1];
          if (!r) return;
          const gone = r.boundingClientRect.height * (1 - r.intersectionRatio);
          hero.style.setProperty("--py", gone.toFixed(1) + "px");
        },
        { threshold: steps },
      );
      drift.observe(hero);
    }
    // A figure of digits counts up from nothing over 1.4 s; a time or a word stays as it is.
    function countUp(b) {
      const text = b.firstChild && b.firstChild.nodeValue;
      if (!text || b.dataset.counted || !/^[\d,]+$/.test(text.trim())) return;
      b.dataset.counted = "1";
      const to = Number(text.replace(/,/g, ""));
      const commas = text.includes(",");
      const t0 = performance.now();
      const tick = (t) => {
        const k = 1 - Math.pow(1 - Math.min(1, (t - t0) / 1400), 3);
        const n = Math.round(to * k);
        b.firstChild.nodeValue = commas ? n.toLocaleString("en-US") : String(n);
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    profileData
      .then((d) => {
        const first = d.owner.name.split(" ")[0] || d.owner.name;
        const rest = d.owner.name.split(/\s+/).slice(1).join(" ");
        $("giant-name").textContent =
          settings.bigName === "full"
            ? d.owner.name.split(/\s+/).join("\n")
            : settings.bigName === "nickname" && settings.nickname
              ? settings.nickname
              : first;
        $("hero-first").textContent = first;
        $("hero-place").textContent = settings.place || "@" + d.owner.handle;
        // The line under the name: the owner's words, else the rest of their name, else the handle.
        // A word or two sits huge beside the name; a sentence takes the line size instead. The
        // rest of the name is all one voice, the italic in the accent (ADR 0052).
        const line = settings.tagline || rest || "@" + d.owner.handle;
        if (settings.tagline) marked(line, $("giant-line"));
        else $("giant-line").textContent = line;
        $("giant-line").classList.toggle("long", line.replace(/\*/g, "").length > 14);
        const meta = $("hero-meta");
        meta.textContent = "";
        // The first sentence of the bio, unless it is the line already under the name.
        const bio = (d.owner.bio || "").split(/(?<=[.!?])\s/)[0].slice(0, 60);
        const plainLine = line.replace(/\*/g, "").trim().toLowerCase();
        for (const text of [
          "@" + d.owner.handle,
          settings.place,
          bio.trim().toLowerCase() === plainLine ? "" : bio,
        ].filter(Boolean))
          meta.append(el("li", "", text));
        heroNow(d.now);
        if (settings.look === "track") trackHero(d, first, rest);
        const avatar = $("avatar");
        if (d.owner.avatarSrc) {
          const img = document.createElement("img");
          img.src = d.owner.avatarSrc;
          img.alt = "";
          avatar.prepend(img);
        } else {
          // No photo yet: the initials on the accent, and a word to the owner (ADR 0051).
          avatar.classList.add("blank");
          avatar.prepend(el("b", "", d.owner.initials || first.slice(0, 1)));
          avatar.append(el("small", "hint", "Add a photo"));
        }
        // The manifesto: hidden without words; the owner sees where it goes while editing.
        const manifesto = $("manifesto");
        if (settings.manifesto) {
          marked(settings.manifesto, manifesto);
          manifesto.hidden = false;
          manifesto.classList.remove("ghost");
        } else {
          manifesto.textContent = "A few sentences in your words, as big as the page.";
          manifesto.hidden = false;
          manifesto.classList.add("ghost");
        }
        chapters();
        roll();
        picks(d.posts);
        // The foot of the page (ADR 0052): the whole name once more, and where this is.
        const foot = document.querySelector(".wall-foot");
        if (foot) {
          foot.textContent = "";
          foot.append(
            el("strong", "", d.owner.name),
            el(
              "span",
              "",
              [
                "Made in Smudge",
                settings.place,
                settings.look === "track" ? new Date().getFullYear() : "",
              ]
                .filter(Boolean)
                .join(" · "),
            ),
          );
        }
        fit();
        if (settings.look === "track") trackMotion();
      })
      .catch(() => {
        $("giant-name").textContent = "Could not load this page.";
      });
    if (document.fonts) document.fonts.ready.then(fit);
  })();
</script>
