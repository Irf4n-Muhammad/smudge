<section class="photo-stack" aria-label="Photo stack">
  <header>
    <h2>A few things worth keeping.</h2>
    <span>Swipe · flip · explore</span>
  </header>
  <div
    class="stack-stage"
    tabindex="0"
    aria-label="Photo stack navigation; use left and right arrows"
  ></div>
  <div class="stack-controls">
    <button class="stack-prev" aria-label="Previous photo">←</button
    ><span class="stack-counter" aria-live="polite"></span
    ><button class="stack-next" aria-label="Next photo">→</button
    ><button class="stack-open">Open post ↗</button>
  </div>
  <p class="stack-status" role="status"></p>
</section>
<style>
  .photo-stack {
    position: relative;
    margin: 24px 20px;
    color: var(--ink, #171717);
    font:
      15px Arial,
      sans-serif;
  }
  .photo-stack header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .photo-stack h2 {
    font:
      italic 25px Georgia,
      serif;
    margin: 0;
  }
  .photo-stack header span {
    font-size: 12px;
    opacity: 0.7;
  }
  .stack-stage {
    height: 365px;
    position: relative;
    touch-action: pan-y;
    outline-offset: 5px;
  }
  .stack-card {
    position: absolute;
    width: 74%;
    height: 330px;
    left: 13%;
    top: 14px;
    background: var(--surface, #fff9eb);
    color: var(--ink, #171717);
    padding: 12px;
    box-shadow: 2px 8px 15px #0003;
    border: 1px solid #8885;
    transform: translate(12px, 9px) rotate(5deg);
    transition:
      transform 0.25s,
      opacity 0.25s;
  }
  .stack-card.active {
    transform: rotate(-3deg);
    z-index: 3;
  }
  .stack-card:not(.active) {
    pointer-events: none;
  }
  .stack-card[hidden] {
    display: none;
  }
  .stack-front,
  .stack-back {
    height: 100%;
  }
  .stack-front > button {
    display: block;
    width: 100%;
    height: 100%;
    text-align: left;
    padding: 0;
    color: inherit;
    background: transparent;
    border: 0;
    cursor: pointer;
  }
  .stack-picture {
    height: 245px;
    background: #b5c3c0;
    overflow: hidden;
    display: grid;
    place-items: center;
    font: italic 32px Georgia;
  }
  .stack-picture img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* A dragged photo would take the swipe away from the stack. */
    -webkit-user-drag: none;
  }
  .stack-picture svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .stack-front strong {
    display: block;
    font: italic 23px Georgia;
    margin-top: 9px;
  }
  .stack-front small {
    display: block;
    margin-top: 3px;
    opacity: 0.7;
  }
  .stack-back {
    padding: 20px;
    background: repeating-linear-gradient(transparent 0 27px, #8883 28px 29px);
    overflow: auto;
  }
  .stack-back h3 {
    font: italic 25px Georgia;
    margin: 0 0 15px;
  }
  .stack-back p {
    line-height: 1.8;
    white-space: pre-wrap;
  }
  .stack-back button {
    padding: 8px 12px;
    border: 1px solid #8887;
    margin: 5px;
    background: var(--surface, #fff9eb);
    color: inherit;
    cursor: pointer;
  }
  .stack-back[hidden],
  .stack-front[hidden] {
    display: none;
  }
  .stack-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 4px;
  }
  .stack-controls button {
    border: 1px solid #8886;
    color: inherit;
    background: var(--surface, #fff9eb);
    padding: 10px 16px;
    cursor: pointer;
  }
  .stack-controls .stack-open {
    background: #191919;
    color: white;
  }
  .stack-status {
    font-size: 12px;
    min-height: 16px;
    margin: 8px 0 0;
  }
  @media (max-width: 600px) {
    .photo-stack {
      margin: 18px 6px;
    }
    .photo-stack h2 {
      font-size: 18px;
    }
    .photo-stack header span {
      font-size: 9px;
    }
    .stack-stage {
      height: 263px;
    }
    .stack-card {
      height: 235px;
      width: 88%;
      left: 6%;
      padding: 9px;
    }
    .stack-picture {
      height: 160px;
    }
    .stack-front strong {
      font-size: 18px;
    }
    .stack-back {
      padding: 10px;
    }
    .stack-back h3 {
      font-size: 18px;
    }
    .stack-back p {
      font-size: 12px;
      line-height: 1.5;
    }
    .stack-controls {
      gap: 8px;
      font-size: 12px;
    }
    .stack-controls button {
      padding: 8px 10px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .stack-card {
      transition: none;
    }
  }
  html[data-motion="reduce"] .stack-card {
    transition: none;
  }
</style>
<script>
  (() => {
    const root = document.querySelector(".photo-stack"),
      stage = root.querySelector(".stack-stage"),
      status = root.querySelector(".stack-status");
    let posts = [],
      cards = [],
      selected = 0,
      social = null,
      start = null;
    function report(e) {
      status.textContent = e.message || "Please try again.";
    }
    function paint() {
      cards.forEach((card, i) => {
        const active = i === selected;
        card.classList.toggle("active", active);
        card.inert = !active;
        card.setAttribute("aria-hidden", String(!active));
        card.hidden = !active && i !== (selected + 1) % cards.length;
        if (!card.hidden && posts[i].hasCover && !card.dataset.coverLoaded) {
          card.dataset.coverLoaded = "true";
          forma.profile
            .cover(posts[i].id)
            .then((cover) => {
              if (!cover) return;
              const img = document.createElement("img");
              img.src = cover.src;
              img.alt = cover.alt;
              img.draggable = false;
              card.querySelector(".stack-picture").replaceChildren(img);
            })
            .catch((e) => {
              delete card.dataset.coverLoaded;
              report(e);
            });
        }
      });
      root.querySelector(".stack-counter").textContent = posts.length
        ? `${selected + 1} / ${posts.length}`
        : "No posts yet";
      root
        .querySelectorAll(".stack-prev,.stack-next")
        .forEach((b) => (b.disabled = posts.length < 2));
      root.querySelector(".stack-open").disabled = !posts.length;
    }
    function move(n) {
      if (!posts.length) return;
      selected = (selected + n + posts.length) % posts.length;
      paint();
    }
    root.querySelector(".stack-prev").onclick = () => move(-1);
    root.querySelector(".stack-next").onclick = () => move(1);
    root.querySelector(".stack-open").onclick = () =>
      forma.profile.openPost(posts[selected].id).catch(report);
    stage.onkeydown = (e) => {
      if (e.target !== stage) return;
      if (["ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
        move(e.key === "ArrowLeft" ? -1 : 1);
      }
    };
    let swiped = false;
    stage.onpointerdown = (e) => {
      if (e.button === 0) {
        start = { x: e.clientX, y: e.clientY };
        swiped = false;
      }
    };
    stage.onpointerup = (e) => {
      if (!start) return;
      const dx = e.clientX - start.x,
        dy = e.clientY - start.y;
      start = null;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
        swiped = true;
        move(dx < 0 ? 1 : -1);
      }
    };
    stage.onpointercancel = () => {
      start = null;
    };
    stage.onpointerleave = () => {
      start = null;
    };
    async function refresh() {
      try {
        social = await forma.profile.social.read();
        window.dispatchEvent(new CustomEvent("profile-social", { detail: social }));
        updateSocial();
      } catch (e) {
        report(e);
      }
    }
    function updateSocial() {
      if (!social) return;
      cards.forEach((card, i) => {
        const p = social.posts.find((p) => p.id === posts[i].id);
        if (!p) return;
        for (const kind of ["like", "save"]) {
          const b = card.querySelector("[data-action=" + kind + "]");
          b.disabled = !social.writable;
          b.setAttribute("aria-pressed", String(kind === "like" ? p.liked : p.saved));
          b.textContent =
            kind === "like" ? (p.liked ? "♥ " : "♡ ") + p.likes : p.saved ? "Saved" : "Save";
        }
      });
    }
    forma.profile
      .read()
      .then((d) => {
        posts = d.posts.filter((p) => p.format !== "story");
        posts.forEach((p, i) => {
          const card = document.createElement("article");
          card.className = "stack-card";
          const front = document.createElement("div");
          front.className = "stack-front";
          const flip = document.createElement("button");
          flip.setAttribute("aria-label", "Flip " + p.title);
          const picture = document.createElement("div");
          picture.className = "stack-picture";
          if (
            !p.hasCover &&
            d.owner.id === "raka" &&
            ["Pages from Sunday", "The long way home"].includes(p.title)
          ) {
            const x = p.title === "Pages from Sunday" ? 537 : 30;
            picture.innerHTML =
              '<svg viewBox="' +
              x +
              ' 480 465 470" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><clipPath id="stack-crop-' +
              i +
              '"><rect x="' +
              x +
              '" y="480" width="465" height="470"/></clipPath></defs><image width="1536" height="1024" href="asset:30000000-0000-4000-8000-000000000001" clip-path="url(#stack-crop-' +
              i +
              ')"/></svg>';
          } else picture.textContent = p.title;
          const title = document.createElement("strong");
          title.textContent = p.title;
          const hint = document.createElement("small");
          hint.textContent = "Turn over for the story ↺";
          flip.append(picture, title, hint);
          front.append(flip);
          const back = document.createElement("div");
          back.className = "stack-back";
          back.hidden = true;
          const heading = document.createElement("h3");
          heading.textContent = p.title;
          const caption = document.createElement("p");
          caption.textContent = p.caption || "A little moment, kept here.";
          const close = document.createElement("button");
          close.textContent = "Back to photo";
          close.onclick = () => {
            back.hidden = true;
            front.hidden = false;
            flip.focus();
          };
          flip.onclick = () => {
            if (swiped) {
              swiped = false;
              return;
            }
            front.hidden = true;
            back.hidden = false;
            close.focus();
          };
          back.append(heading, caption, close);
          for (const kind of ["like", "save"]) {
            const b = document.createElement("button");
            b.dataset.action = kind;
            b.setAttribute("aria-label", (kind === "like" ? "Like " : "Save ") + p.title);
            b.textContent = kind;
            b.disabled = true;
            b.onclick = async () => {
              b.disabled = true;
              try {
                social = await forma.profile.social.toggle({ action: kind, postId: p.id });
                updateSocial();
                window.dispatchEvent(new CustomEvent("profile-social", { detail: social }));
              } catch (e) {
                report(e);
                b.disabled = !social?.writable;
              }
            };
            back.append(b);
          }
          card.append(front, back);
          cards.push(card);
          stage.append(card);
        });
        paint();
        if (!posts.length) status.textContent = "Publish a post to start your photo stack.";
        else refresh();
      })
      .catch(report);
    window.addEventListener("focus", () => {
      if (posts.length) refresh();
    });
  })();
</script>
